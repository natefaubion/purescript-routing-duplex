    - js-uri: ">=3.1.0 <4.0.0"
    - lazy: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - profunctor: ">=6.0.1 <7.0.0"
    - record: ">=4.0.0 <5.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
    - variant: ">=8.0.0 <9.0.0"
